name: tapwallet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tapwallet}
      POSTGRES_USER: ${POSTGRES_USER:-tapwallet}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tapwallet} -d ${POSTGRES_DB:-tapwallet}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mongodb:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 7s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 7s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres,mongodb,rabbitmq
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tapwallet}
      DATABASE_USERNAME: ${POSTGRES_USER:-tapwallet}
      DATABASE_PASSWORD: ""
      MONGODB_URI: mongodb://mongodb:27017/tapwallet
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
