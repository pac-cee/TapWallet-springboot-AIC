spring.application.name=TapWallet
server.port=8080

# In-memory H2 database (recreated on every start)
spring.datasource.url=jdbc:h2:mem:tapwallet;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Default classroom profile: no external services are required.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
spring.data.mongodb.repositories.enabled=false
tapwallet.security.enabled=true
tapwallet.security.jwt-secret=${JWT_SECRET:}
tapwallet.security.token-lifetime=PT8H
tapwallet.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:tapwallet)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Health endpoint used by Docker and deployment platforms.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.rabbit.enabled=false
management.health.mongo.enabled=false

server.compression.enabled=true
server.compression.min-response-size=1024
