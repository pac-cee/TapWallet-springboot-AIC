spring.application.name=TapWallet
server.port=8080

# In-memory H2 database (recreated on every start)
spring.datasource.url=jdbc:h2:mem:tapwallet;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:tapwallet)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
