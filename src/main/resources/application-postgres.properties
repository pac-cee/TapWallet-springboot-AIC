# Activate with SPRING_PROFILES_ACTIVE=postgres (usually together with mongodb,rabbitmq).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tapwallet}
spring.datasource.username=${DATABASE_USERNAME:tapwallet}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
