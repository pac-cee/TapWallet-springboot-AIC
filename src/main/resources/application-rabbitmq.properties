# RabbitMQ carries notification events. The default profile uses an in-memory publisher.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:tapwallet}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:tapwallet}
management.health.rabbit.enabled=true
